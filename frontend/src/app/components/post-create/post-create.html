<section class="post-create-section" aria-label="Tạo bài đăng mới">
  <h3 class="section-title">Tạo bài đăng mới</h3>

  <form class="post-form" (ngSubmit)="submitPost()">
    <div class="form-group">
      <label for="post-title-input" class="form-label">Tiêu đề (tùy chọn)</label>
      <input
        id="post-title-input"
        type="text"
        class="post-title-input"
        placeholder="Tiêu đề bài đăng..."
        [value]="title()"
        (input)="onTitleChange($any($event.target).value)"
        [disabled]="isSubmitting() || !authService.isLoggedIn()"
      />
    </div>

    <div class="form-group textarea-wrapper">
      <label for="post-content-input" class="form-label">Nội dung bài đăng</label>
      <textarea
        id="post-content-input"
        class="post-textarea"
        rows="4"
        placeholder="Bạn đang nghĩ gì? (tối đa 500 ký tự)"
        [value]="content()"
        (input)="onContentChange($any($event.target).value)"
        [disabled]="isSubmitting() || !authService.isLoggedIn()"
      ></textarea>

      <div class="counter-and-actions">
        <!-- Đếm ký tự còn lại theo Unicode code points (AC1, AC2, AC3, AC4) -->
        <span
          class="char-counter"
          [class.over-limit]="remainingChars() < 0"
          data-testid="post-char-counter"
        >{{ remainingChars() }}</span>
      </div>
    </div>

    <!-- Thông báo lỗi (AC6, AC7, AC8) -->
    @if (errorMessage()) {
      <div class="alert error-alert" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <!-- Thông báo thành công -->
    @if (successMessage()) {
      <div class="alert success-alert" role="status">
        {{ successMessage() }}
      </div>
    }

    <div class="form-actions">
      <button
        type="submit"
        class="submit-button"
        [disabled]="isSubmitting() || !authService.isLoggedIn() || !isContentValid()"
      >
        @if (isSubmitting()) {
          <span>Đang đăng...</span>
        } @else {
          <span>Đăng</span>
        }
      </button>
    </div>
  </form>
</section>
