<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2 class="login-title">Đăng nhập tài khoản</h2>
      <p class="login-subtitle">Vui lòng đăng nhập để thích bài đăng và tham gia tương tác.</p>
    </div>

    <div class="login-notice" role="alert">
      <span class="notice-icon">ℹ️</span>
      <span>Hệ thống yêu cầu đăng nhập trước khi thực hiện hành động này.</span>
    </div>

    <div class="login-actions">
      <button type="button" class="btn btn-primary" (click)="onLogin()" data-testid="login-submit-btn">
        Đăng nhập với tài khoản thử nghiệm
      </button>
      <button type="button" class="btn btn-secondary" (click)="goHome()" data-testid="back-home-btn">
        Quay lại trang chủ
      </button>
    </div>
  </div>
</div>
